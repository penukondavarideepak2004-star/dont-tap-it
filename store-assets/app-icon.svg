<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#131A29"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00D2FC"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#B388FF"/>
      <stop offset="100%" stop-color="#FF2E63"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.8" />

  <!-- Ambient background energy circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00F0FF" stroke-width="4" opacity="0.2" stroke-dasharray="16 12" />

  <!-- Lightning Bolt Icon -->
  <path d="M280 64 L120 288 L240 288 L232 448 L392 224 L272 224 Z" fill="url(#zapGrad)" filter="url(#glow)" />

  <!-- Orbiting accent shapes -->
  <circle cx="120" cy="140" r="22" fill="#FF2E63" />
  <rect x="360" y="130" width="36" height="36" rx="10" fill="#00E676" transform="rotate(25 378 148)" />
  <polygon points="380,380 410,430 350,430" fill="#FFD600" />
</svg>
